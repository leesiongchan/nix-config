keys:
  # Per-host operational keys (each host holds only its own private key at
  # ~/.config/sops/age/keys.txt; never copy one host's key to another).
  - &host_borisov age1tz53d84qcl20t4u29hv956tdgz2j56us0lx0343wew7zrg9zcumqk9wctr
  # - &host_atlas ""
  # - &host_oumuamua ""

  # Offline recovery key. Private half lives only in the password manager,
  # never on disk on any host. Used solely to recover/re-encrypt if every
  # host key is lost simultaneously.
  - &recovery age1hq3e28f7e5yu7jdklwdqpdxjtln7cdv3asnaqy26zp8wkc47egtsd834p5

creation_rules:
  - path_regex: secrets.yaml$
    key_groups:
      - age:
          - *host_borisov
          # - *host_atlas
          # - *host_oumuamua
          - *recovery
